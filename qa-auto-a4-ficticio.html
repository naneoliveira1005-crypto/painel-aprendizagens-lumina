<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumina QA • Teste fictício da correção automática A4</title>
<style>body{font:15px Arial,sans-serif;background:#eff3ef;color:#1e4333;max-width:1100px;margin:25px auto;padding:0 18px}
h1{font-size:23px}p{line-height:1.55}button{padding:13px 19px;background:#184a3b;color:white;border:0;border-radius:9px;font-weight:bold;cursor:pointer}
pre{white-space:pre-wrap;background:#fff;padding:14px;border:1px solid #d2dfd6;border-radius:10px}
main{display:grid;grid-template-columns:300px 1fr;gap:18px}
canvas{max-width:100%;border:1px solid #b3c4b6}iframe{width:100%;height:680px;border:1px solid #d2dfd6;border-radius:10px;background:white}
@media(max-width:820px){main{display:block}iframe{height:640px}}</style>
<script src="qrcode-generator.js"></script>
<script src="fichas-personalizadas.js?v=20261108-teste-v4"></script>
</head><body>
<h1>Teste técnico fictício: foto inclinada → A4 → leitor QR + X</h1>
<p>Somente uma ficha fictícia é criada no próprio navegador. Nada é enviado ao banco, nem contém dados reais de crianças.</p>
<button id="run" type="button">Executar teste completo automaticamente</button>
<pre id="status">Pronto para testar.</pre>
<main>
<div><h2>Foto simulada</h2><canvas id="photo" width="760" height="990"></canvas></div>
<div><h2>Leitor V5</h2><iframe id="reader" title="Leitor V5 (teste fictício)" src="leitor-v5.html?v=20261108-auto-a4-v1"></iframe></div>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
async function pauseFor(predicate,timeout=45000){
 const start=Date.now();
 while(Date.now()-start<timeout){if(predicate())return true;await new Promise(r=>setTimeout(r,300));}
 throw new Error('O leitor não concluiu o teste no tempo disponível.');
}
async function makePhoto(){
 const svgText=window.LuminaFichas.testFixtureMarkup();
 const div=document.createElement('div');div.innerHTML=svgText;
 const svg=div.querySelector('svg');svg.setAttribute('xmlns','http://www.w3.org/2000/svg');
 const paper=document.createElementNS('http://www.w3.org/2000/svg','rect');paper.setAttribute('x','0');paper.setAttribute('y','0');paper.setAttribute('width','100%');paper.setAttribute('height','100%');paper.setAttribute('fill','#ffffff');svg.insertBefore(paper,svg.firstChild);
 svg.setAttribute('width','1191');svg.setAttribute('height','1684');
 const u=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml;charset=utf-8'}));
 try{
  const img=new Image();
  await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=u;});
  const canvas=$('photo'),ctx=canvas.getContext('2d',{willReadFrequently:true});
  ctx.fillStyle='#8a8d87';ctx.fillRect(0,0,canvas.width,canvas.height);
  for(let y=0;y<990;y+=17){
   ctx.fillStyle=y%34?'rgba(30,45,30,.025)':'rgba(245,240,215,.035)';
   ctx.fillRect(0,y,760,8);
  }
  ctx.save();
  ctx.setTransform(525/1191,15/1191,-30/1684,830/1684,100,70);
  ctx.drawImage(img,0,0,1191,1684);
  ctx.restore();
  return await new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(Error('Falha no PNG simulado')),'image/png'));
 }finally{URL.revokeObjectURL(u);}
}
$('run').onclick=async()=>{
 const btn=$('run');btn.disabled=true;
 try{
  $('status').textContent='Gerando fotografia fictícia inclinada...';
  const photo=await makePhoto();
  const iframe=$('reader'),frame=iframe.contentWindow,doc=frame.document;
  await pauseFor(()=>doc.querySelector('#files')&&typeof frame.LuminaAutoA4?.detect==='function',15000);
  const detectedCorners=frame.LuminaAutoA4.detect($('photo'));
  const detectionResult=detectedCorners?'Bordas automáticas: '+detectedCorners.corners.map(c=>'('+Math.round(c.x)+','+Math.round(c.y)+')').join(' ')+'; confiança '+Math.round(detectedCorners.confidence*100)+'%':'Bordas automáticas: NÃO DETECTADAS';
  const file=new File([photo],'foto-ficticia-inclinada.png',{type:'image/png'});
  const dt=new DataTransfer();dt.items.add(file);
  doc.querySelector('#files').files=dt.files;
  doc.querySelector('#files').dispatchEvent(new Event('change',{bubbles:true}));
  await pauseFor(()=>doc.querySelector('#countTotal').textContent.trim()==='1'&&!doc.querySelector('#analyze').disabled,15000);
  $('status').textContent='Analisando uma fotografia inclinada sem marcar os quatro cantos...';
  doc.querySelector('#analyze').click();
  await pauseFor(()=>doc.querySelector('#message').textContent.includes('Análise finalizada'),90000);
  const result=doc.querySelector('#message').textContent;
  const detail=doc.querySelector('#rows')?.innerText||'';
  $('status').textContent='RESULTADO DO LEITOR:\n'+result+'\n'+detectionResult+'\nDETALHES:\n'+detail+
    '\n\nResultado esperado: 1 pronta; 0 com pendências. Nesta simulação, a detecção deve corrigir automaticamente a foto.';
 }catch(err){
  $('status').textContent='TESTE NÃO CONCLUÍDO: '+(err.message||String(err));
 }finally{btn.disabled=false;}
};
</script></body></html>
